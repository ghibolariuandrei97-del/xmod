[settings]
max_rows = 50
http_allow = 127.0.0.1, localhost
socket_allow = 127.0.0.1:18081, 127.0.0.1:18082, 127.0.0.1:18090
max_connections = 3          ; an inline comment
max_response_bytes = 100000
max_timeout = 5
[db:testdb]
driver = sqlite
file = test_query.db         ; inline comment after a file name
[db:mem]
driver = sqlite
file = :memory:
[db:badfile]
driver = sqlite
file = ../evil.db
[db:mymysql]
driver = mysql
host = 127.0.0.1
port = 3399
timeout = 2
user = nobody
pass = secret
database = nothing
