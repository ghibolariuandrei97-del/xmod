// xmod bots - executed by xbots.lua on every map start (before the 'config' event)

// --- how many bots
xbots_quota 10               // number of bots (meaning depends on xbots_quota_mode)
xbots_quota_mode fill        // fill = bots + humans = quota | fixed = always quota bots | match = quota bots per human
xbots_keep_slot 1            // keep this many slots free for humans
xbots_join_team any          // any | t | ct

// --- difficulty
xbots_difficulty 2           // 0 newbie | 1 easy | 2 normal | 3 hard | 4 expert
xbots_skill_min -1           // exact skill range 0..100 (overrides difficulty when >= 0)
xbots_skill_max -1
xbots_reaction 1.0           // reaction time multiplier (1.3 = slower, 0.8 = faster)
xbots_aim_head 1.0           // headshot preference multiplier
xbots_fov 100                // field of view (degrees)
xbots_vision 4000            // how far bots can see (units)
xbots_think 0.1              // seconds between decisions (0.05 - 0.5)

// --- behaviour
xbots_buy 1
xbots_eco 1                  // team economy: save rounds together
xbots_grenades 1
xbots_restrict ""            // never buy these, e.g. "awp,g3sg1,sg550"
xbots_knife_only 0
xbots_peaceful 0             // 1 = bots never attack
xbots_frozen 0               // 1 = bots do not move
xbots_ffa 0                  // 1 = attack everybody (deathmatch)
xbots_radio 1
xbots_obey 1                 // follow human radio/chat orders ("followme", "boti dupa mine", "bots hold")

// --- chat, memory, AI
xbots_chat 1
xbots_chat_rate 1.0          // 0 = silent ... 2 = talkative
xbots_chat_lang ro           // ro | en
xbots_ai 0                   // 1 = smart replies through an LLM (configs/xbots.ini [ai], needs xmod_query)
xbots_memory 1               // bots remember players, nemesis, weapons, stats (data/vaults/xbots_memory.vault)
xbots_tag ""                 // name prefix, e.g. "[BOT] "

// --- navigation
xbots_learn 1                // learn nodes from human movement + danger / good spots from every death
xbots_auto_nav 1             // analyze maps without a .nav file automatically
xbots_nav_max 6000

xbots_admin_flag h           // access letter for 'xbots' commands and say /bots, /botnav
xbots_debug 0
