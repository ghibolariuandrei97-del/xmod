[ai]
; Smart chat replies (xbots_ai 1). Needs the xmod_query extension. Any OpenAI-compatible endpoint works:
;   OpenAI      url = https://api.openai.com/v1/chat/completions          model = gpt-4o-mini
;   OpenRouter  url = https://openrouter.ai/api/v1/chat/completions       model = (any)
;   Groq        url = https://api.groq.com/openai/v1/chat/completions     model = llama-3.1-8b-instant
;   Ollama      url = http://127.0.0.1:11434/v1/chat/completions          model = llama3.1   (local, free, no key)
;   Anthropic   provider = anthropic   url = https://api.anthropic.com/v1/messages   model = claude-haiku-4-5
; HTTPS on Linux needs the 32-bit libcurl (see query.ini); plain http (Ollama on the same machine) works without.
; Allow the host in configs/query.ini (http_allow) if you restricted it.
provider = openai
url =
key =
model =
timeout = 8
per_minute = 8
max_tokens = 60
; prompt = (optional, one line) placeholders: {me} {pers} {lang} {map} {team} {k} {d} {memory}
